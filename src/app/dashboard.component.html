<nav class="dashboard-navbar">
  <div class="navbar-brand" routerLink="/app" style="cursor: pointer;">WaterWise</div>
  <ul class="nav-links">
    <li class="nav-item">
      <button class="nav-link" routerLink="/sanitation" routerLinkActive="active">Sanitation Access</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" routerLink="/water-conservation" routerLinkActive="active">Conservation Guide</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" routerLink="/water-quality" routerLinkActive="active">Quality Monitor</button>
    </li>
  </ul>

  <div class="search-group" style="display: flex; align-items: center; gap: 15px;">
    

    <form class="search-form" role="search" style="margin: 0;">
      <input class="search-input" type="search" placeholder="Search" aria-label="Search" />
      <button class="search-button" type="submit">Search</button>
    </form>

    <button type="button" class="profile-avatar" aria-label="Profile" (click)="goToProfile()">
      <img [src]="profileImage" alt="Profile avatar" />
    </button>

    <button *ngIf="!isAuthenticated" (click)="login()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Login
    </button>
    <button *ngIf="isAuthenticated" (click)="logout()" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Logout
    </button>
  </div>
</nav>
