<div class="dashboard-welcome">
  <div class="dashboard-user-card">
    <img [src]="profileImage" alt="Profile photo" class="dashboard-profile-avatar" />
    <div class="dashboard-user-text">
      <p class="dashboard-hello">Welcome back,</p>
      <h2>{{ profileName }}</h2>
      <p class="dashboard-description">{{ profileDescription }}</p>
    </div>
  </div>
</div>

<div class="dashboard-content">
</div>
